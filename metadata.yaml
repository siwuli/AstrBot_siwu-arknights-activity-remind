name: arknights_activity_remind
display_name: 明日方舟活动提醒
short_desc: 定时/实时提醒明日方舟活动、卡池、危机合约等开闭时间并推送到开启的群
desc: "v2.2.2 修复全新安装下载数据全失败：镜像以 text/plain 返回 .json 时 aiohttp 的 resp.json() 会拒绝解析（需 content_type=None），导致 4 张表无一落盘——本机因复用 query 的共享 gamedata 看不出来，只装本插件的用户会没有数据；移植自 AmiyaBot arknights-activity-remind-2.0：自动获取明日方舟官方游戏数据（活动/主题曲/危机合约/集成战略/生息演算/卡池/保全派驻周期），后台每分钟检查，按配置提前 N 天定时提醒或到点实时提醒开启活动提醒的群；支持 @所有人 / 连发三遍等提醒方式。v2.1.0 多平台适配：群标识不再限定纯数字，兼容 OneBot v11（纯数字群号）、QQ 官方机器人（group_openid）、Telegram（负数 chat_id）、Discord 等任意适配器；订阅按平台分别记录，平台失效时自动跳过并提供清理指令。v2.2.0 跨平台群号订阅：配合 platform_alias 插件，订阅以真实群号为键，换适配器后自动改投到新平台，老配置里的群号无需重新订阅；映射表热更新，改完即生效。免 LLM，纯后台轮询 + 主动推送。v2.2.1 数据源默认改为可达镜像：主源原默认 raw.githubusercontent（实测在部分网络直接被重置连接），现默认走镜像，备用列表补 gh-proxy 并把直连降为最后兜底（镜像列表本就有 jsDelivr/ghproxy，主源修好后不再先浪费一次必然失败的请求）"
help: "指令：开启活动提醒 / 关闭活动提醒（管理员，群聊）/ 活动列表 [类型] / 刷新活动数据（管理员）/ 活动提醒状态 / 活动提醒清理（管理员，清理失效平台订阅）"
version: 2.2.2
author: siwuli
repo: https://github.com/siwuli/AstrBot_siwu-arknights-activity-remind
astrbot_version: ">=4.0.0"
